base_model: Qwen/Qwen2.5-7B
quantization: 4bit
lora_r: 64
lora_alpha: 128
lora_dropout: 0.05
learning_rate: 1e-5
group_size: 8          # G completions per prompt — note in a comment that this may need
                       # to drop to 4 if 16GB VRAM can't hold G=8 generation + PRM scoring
max_new_tokens: 512
adaptive_kl:
  beta_init: 0.04
  beta_min: 0.01
  beta_max: 0.3
reward_weights:
  outcome: 0.40
  prm: 0.20
  consensus: 0.20
  consistency: 0.10
  self_correction: 0.05
  format: 0.05
